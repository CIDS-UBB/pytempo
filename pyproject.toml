[project]
# Numele de import este "pytempo". Numele de distribuție pe PyPI este "pytempo-ins"
# fiindcă "pytempo" e deja luat pe PyPI (o extensie Web3, fără legătură). Pentru uz
# propriu instalezi din GitHub și "import pytempo" merge oricum.
name = "pytempo-ins"
version = "0.25.0"
description = "Bibliotecă Python pentru accesul la datele INS TEMPO Online"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vlad Alexe", email = "alexe.vld@gmail.com" },
]
keywords = ["insse", "tempo", "romania", "statistics", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
]

[project.optional-dependencies]
ai = []
# felii Parquet in download(): mai rapide si pastreaza tipurile. Fara pyarrow,
# download() scrie feliile ca CSV, acelasi mecanism. Nucleul ramane requests +
# pandas, deci pyarrow e extra, nu dependinta de baza.
fast = ["pyarrow>=14"]
dev = ["pytest>=7", "build>=1"]

[project.urls]
Homepage = "https://github.com/CIDS-UBB/pytempo"
Repository = "https://github.com/CIDS-UBB/pytempo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytempo"]
